[project]
name = "booking"
version = "0.1.0"
description = "WEB-app for ticket sales and booking (REST API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers[postgres]>=4.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# FastAPI DI uses Depends() in argument defaults — canonical idiom
"src/booking/routers/*" = ["B008"]
"src/booking/core/deps.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = []
